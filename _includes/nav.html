{%- assign w = site.data.workshop -%}
<header class="site-header">
  <div class="wrap nav-bar">
    <a class="brand" href="{{ '/' | relative_url }}">
      <span class="brand-text">
        <span class="brand-name">{{ w.name }} {{ w.edition }}</span>
        <span class="brand-sub">{{ w.conference_name }} &middot; {{ w.city }}</span>
      </span>
    </a>

    <button class="nav-toggle" aria-expanded="false" aria-controls="site-nav">
      <span class="nav-toggle-bars" aria-hidden="true"></span>
      <span class="visually-hidden">Menu</span>
    </button>

    <nav id="site-nav" class="site-nav" aria-label="Main">
      <ul>
        {%- for item in site.data.navigation -%}
        {%- assign target = item.url | relative_url -%}
        <li>
          <a href="{{ target }}"{% if page.url == item.url %} class="is-active" aria-current="page"{% endif %}>{{ item.title }}</a>
        </li>
        {%- endfor -%}
      </ul>
    </nav>
  </div>
</header>
