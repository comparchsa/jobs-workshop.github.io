  url: https://rwong.cs.illinois.edu/
  photo: https://rwong.cs.illinois.edu/images/Wong_Photo.jpg
  photo_position: center 20%
  photo_zoom: 1.5

- name: Alenkruth Krishnan Murali
  affiliation: University of Virginia
  url: https://alenkruth.com/
  photo: https://alenkruth.com/media/images/avatar.jpg
  photo_position: center 20%
  photo_zoom: 1.15

- name: Abdulrahman Mahmoud
  affiliation: MBZUAI
  url: https://ma3mool.github.io/
  photo: https://ma3mool.github.io/images/abdulrahman.jpg
  photo_position: center 20%

- name: CASA Steering Group
  affiliation: Computer Architecture Student Association
  url: https://www.comparchsa.org
  # comparchsa.org redirects to sigarch.org/casa, which is where the logo lives.
  photo: https://www.sigarch.org/wp-content/uploads/2021/02/CASA_logo_small.png
  photo_fit: contain   # a logo, so fit it whole rather than cropping to a face
  initials: CASA       # fallback if the logo ever moves
