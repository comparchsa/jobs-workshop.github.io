# ---------------------------------------------------------------------------
# Organizing committee, in the order they should appear on the site.
#
# Each entry:
#   name         – required
#   affiliation  – required
#   role         – optional, e.g. "General Chair"; shown as a small tag
#   url          – optional homepage
#   photo        – optional. Either a path in this repo
#                  ("/assets/img/organizers/name.jpg") or a full URL to an
#                  image on someone else's site ("https://..."). Both work.
#                  If omitted, the site draws a circle with the initials.
#   photo_position – optional framing, default "center 20%". The second value
#                  is the vertical anchor: 0% = top of the photo, 100% =
#                  bottom. Lower it to pull the face down into the circle.
#   photo_zoom   – optional magnification for wide shots, default 1.
#   photo_fit    – set to "contain" for a logo instead of a face: the image is
#                  fitted whole inside the circle on a white disc rather than
#                  cropped to fill it.
#   initials     – optional override for that circle, for entries that are not
#                  a person (e.g. "CASA" rather than "CS")
#
# The photos below are hotlinked from each organizer's own homepage, so they
# update automatically when that person updates their site. The trade-off is
# that they break if someone renames or moves their file — the circle just
# goes blank, nothing else is affected. Swap any entry for a local copy under
# assets/img/organizers/ if that happens.
# ---------------------------------------------------------------------------

- name: Mariam Elgamal
  affiliation: Harvard University
  url: https://mariamelgamal.com/
  photo: https://mariamelgamal.com/assets/img/prof_pic.jpg
  photo_position: center 12%
  photo_zoom: 1.2

