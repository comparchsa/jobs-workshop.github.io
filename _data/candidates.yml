# Keep the list alphabetical by last name — the page says it is.
#
# Each entry:
#   name                – required
#   role                – e.g. "PhD student", "Postdoc". Small line under the name.
#   affiliation         – required (university, lab, or company)
#   areas               – list of research areas. Each is drawn as a coloured
#                         box; the colour comes from .area--<slug> in
#                         style.css, and an area with no rule there falls back
#                         to a neutral grey box.
#   seeking             – list of positions, e.g. "Industry", "Research faculty"
#   market              – when they go on the market, e.g. "2026 (this cycle)"
#   grad                – expected graduation, e.g. "Jul 2027"
#   cv                  – optional URL. Omit and the cell shows "—".
#   research_statement  – optional URL, listed right after the CV
#   teaching_statement  – optional URL, listed right after the CV
#   website             – optional personal homepage; links the name
#
# Only list material the candidate agreed to make public.
# ---------------------------------------------------------------------------

