# ---------------------------------------------------------------------------
# Site-wide settings. Change these once per workshop edition.
# After editing this file you MUST restart `bundle exec jekyll serve`;
# _config.yml is the one file Jekyll does not hot-reload.
# ---------------------------------------------------------------------------

title: JOBS Workshop 2026
tagline: A workshop to help recent PhD graduates
description: >-
  The JOBS Workshop helps senior PhD students and postdocs in computer
  architecture navigate the academic and industrial job market. Half-day
  workshop co-located with MICRO-59 in Athens, Greece.

# Where the site is published.
#   url     = scheme + host, no trailing slash
#   baseurl = the sub-path, with a leading slash and no trailing slash
#             (set baseurl to "" if you later move to a custom domain)
url: https://comparchsa.github.io
baseurl: /jobs-workshop.github.io

lang: en-US

# Link previews on Slack / Twitter / WhatsApp. jekyll-seo-tag only reads
# `image` from a PAGE, not from here, so it is applied to every page via
# `defaults` at the bottom of this file. Must be a raster image at roughly
# 1200x630 — the social platforms will not render an SVG.
twitter:
  card: summary_large_image
  # CASA's account, used for card attribution. Without a username here
  # jekyll-seo-tag emits a bare "@" as twitter:site. Change or delete both
  # lines if attribution should point somewhere else.
  username: CompArchSA

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Nothing below here normally needs touching.
exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - vendor

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: page
      image: /assets/img/social-card.png
